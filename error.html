<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Century Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondologin.webp') center/cover; }
        .error-box { background: white; padding: 40px; border-radius: 25px; text-align: center; width: 350px; border: 2px solid #e74c3c; }
        i { color: #e74c3c; font-size: 3rem; margin-bottom: 20px; }
        h2 { color: #5d4037; }
        .btn-regresar { display: block; padding: 15px; background: #b08968; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="error-box">
        <i class="fas fa-exclamation-triangle"></i>
        <h2>Acceso Denegado</h2>
        <p>Usuario o contraseña incorrectos. El intento ha sido registrado en la bitácora de seguridad.</p>
        <a href="/" class="btn-regresar">REINTENTAR</a>
    </div>
</body>
</html>
