<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Panel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ESTILOS BASADOS EN TU DISEÑO DE MAQUILLAJE */
        :root {
            --rosa-claro: #fdf2f8;
            --rosa-medio: #fce4ec;
            --cafe-glow: #5d4037;
            --dorado-suave: #b08968;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--rosa-claro);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            background: var(--blanco);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 20px;
        }

        .header {
            background-color: var(--blanco);
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rosa-medio);
        }

        .header h2 {
            color: var(--cafe-glow);
            margin: 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        /* TABLA ESTILO PROFESIONAL */
        .table-container {
            padding: 20px 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: var(--cafe-glow);
            color: white;
            text-align: left;
            padding: 15px;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--rosa-medio);
            color: #444;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #fff9fb;
        }

        /* ETIQUETAS DE BITÁCORA */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .acceso-correcto { background-color: #d4edda; color: #155724; }
        .acceso-fallido { background-color: #f8d7da; color: #721c24; }
        .cierre-sesion { background-color: #fff3cd; color: #856404; }

        .user-cell {
            font-weight: bold;
            color: var(--dorado-suave);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2><i class="fas fa-clipboard-list"></i> Bitácora de Seguridad - Glow Studio</h2>
            <button onclick="cerrarSesion()" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th><i class="far fa-calendar-alt"></i> Fecha y Hora</th>
                        <th><i class="far fa-user"></i> Usuario</th>
                        <th><i class="fas fa-fingerprint"></i> Evento / Acción</th>
                        <th><i class="fas fa-key"></i> ID de Sesión</th>
                    </tr>
                </thead>
                <tbody id="tabla-logs">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función para cargar los datos reales del servidor
        async function cargarBitacora() {
            try {
                const response = await fetch('/api/logs');
                const logs = await response.json();
                const tbody = document.getElementById('tabla-logs');

                tbody.innerHTML = logs.map(log => {
                    // Asignar clase de color según el tipo de bitácora
                    let claseBadge = "";
                    if (log.tipo === "ACCESO_CORRECTO") claseBadge = "acceso-correcto";
                    else if (log.tipo === "ACCESO_FALLIDO") claseBadge = "acceso-fallido";
                    else claseBadge = "cierre-sesion";

                    return `
                        <tr>
                            <td>${new Date(log.fecha).toLocaleString()}</td>
                            <td class="user-cell">${log.usuario}</td>
                            <td><span class="badge ${claseBadge}">${log.tipo}</span></td>
                            <td style="font-family: monospace; font-size: 0.85em; color: #888;">
                                ${log.sessionID || 'N/A'}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error("Error al cargar la bitácora:", error);
            }
        }

        // Función para cerrar sesión (registra la bitácora 3)
        async function cerrarSesion() {
            await fetch('/logout');
            window.location.href = "/";
        }

        // Cargar datos al iniciar y actualizar cada 5 segundos
        window.onload = cargarBitacora;
        setInterval(cargarBitacora, 5000);
    </script>
</body>
</html>
