<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Panel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --rosa-claro: #fdf2f8;
            --rosa-medio: #fce4ec;
            --cafe-glow: #5d4037;
            --dorado-suave: #b08968;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--rosa-claro);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            background: var(--blanco);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 20px;
        }

        .header {
            background: var(--blanco);
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rosa-medio);
        }

        .header h1 {
            margin: 0;
            color: var(--cafe-glow);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        /* TABLA DE BITÁCORAS */
        .table-container {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--rosa-medio);
            color: var(--cafe-glow);
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        tr:hover {
            background-color: #fff9fb;
        }

        /* BADGES DE ESTADO */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .acceso-correcto { background: #d4edda; color: #155724; }
        .acceso-fallido { background: #f8d7da; color: #721c24; }
        .cierre-sesion { background: #fff3cd; color: #856404; }

        .user-cell {
            font-weight: bold;
            color: var(--dorado-suave);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Panel de Seguridad Glow Studio</h1>
            <button class="btn-logout" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>

        <div class="table-container">
            <h2 style="color: var(--cafe-glow); margin-bottom: 5px;">Bitácora de Eventos</h2>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 25px;">Monitoreo en tiempo real desde MongoDB Atlas</p>
            
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Usuario</th>
                        <th>Evento / Tipo</th>
                        <th>ID de Sesión (Seguridad)</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función para cargar las bitácoras desde el servidor Node.js
        async function cargarBitacoras() {
            try {
                const response = await fetch('/api/logs'); // Ruta que creamos en server.js
                const logs = await response.json();
                const tbody = document.getElementById('logs-body');

                tbody.innerHTML = logs.map(log => {
                    // Determinar el estilo según el tipo de log
                    let claseBadge = "";
                    if (log.tipo === "ACCESO_CORRECTO") claseBadge = "acceso-correcto";
                    else if (log.tipo === "ACCESO_FALLIDO") claseBadge = "acceso-fallido";
                    else claseBadge = "cierre-sesion";

                    return `
                        <tr>
                            <td>${new Date(log.fecha).toLocaleString()}</td>
                            <td class="user-cell">${log.usuario}</td>
                            <td><span class="badge ${claseBadge}">${log.tipo}</span></td>
                            <td style="font-family: monospace; font-size: 0.85em; color: #888;">
                                ${log.sessionID || 'N/A'}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error("Error al cargar bitácoras:", error);
            }
        }

        // Función para salir (Bitácora 3)
        async function cerrarSesion() {
            await fetch('/logout');
            window.location.href = "/";
        }

        // Cargar al inicio y refrescar cada 5 segundos
        window.onload = cargarBitacoras;
        setInterval(cargarBitacoras, 5000);
    </script>
</body>
</html>
