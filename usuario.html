<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Catálogo de Belleza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --rosa-fondo: #fdf2f8;
            --rosa-fuerte: #fce4ec;
            --cafe-texto: #5d4037;
            --dorado: #b08968;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Century Gothic', 'Segoe UI', sans-serif;
            background-color: var(--rosa-fondo);
            margin: 0;
            color: var(--cafe-texto);
        }

        /* BARRA DE NAVEGACIÓN */
        .navbar {
            background: var(--blanco);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        /* CUADRÍCULA DE PRODUCTOS */
        .main-content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--blanco);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            border: 1px solid var(--rosa-fuerte);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .product-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
        }

        .product-info h3 {
            margin: 10px 0;
            font-size: 1.2rem;
        }

        .price {
            display: block;
            color: var(--dorado);
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-add {
            background: var(--cafe-texto);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-add:hover {
            background: var(--dorado);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>Glow Studio</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span id="saludo">¡Bienvenida!</span>
            <button class="btn-logout" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </nav>

    <div class="main-content">
        <h2 style="text-align: center; margin-bottom: 40px; color: var(--cafe-texto);">Nuestra Colección</h2>
        
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500" class="product-img">
                <div class="product-info">
                    <h3>Labial Matte "Velvet Rose"</h3>
                    <span class="price">$350.00 MXN</span>
                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1522338221020-fa7c00446b1d?w=500" class="product-img">
                <div class="product-info">
                    <h3>Paleta de Sombras "Earth"</h3>
                    <span class="price">$850.00 MXN</span>
                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1596704017254-9b121068fb31?w=500" class="product-img">
                <div class="product-info">
                    <h3>Base Fluida Larga Duración</h3>
                    <span class="price">$520.00 MXN</span>
                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1631214503951-375103322e4c?w=500" class="product-img">
                <div class="product-info">
                    <h3>Suero Revitalizante Facial</h3>
                    <span class="price">$420.00 MXN</span>
                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONEXIÓN CON EL SERVIDOR PARA BITÁCORA DE CIERRE
        async function cerrarSesion() {
            try {
                // Esto llama a la ruta /logout en server.js que registra la bitácora 3
                await fetch('/logout');
                // Redirigir al inicio después de registrar la salida
                window.location.href = "/";
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>
