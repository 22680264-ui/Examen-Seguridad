<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Catálogo de Belleza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --rosa-fondo: #fdf2f8;
            --rosa-fuerte: #fce4ec;
            --cafe-texto: #5d4037;
            --dorado: #b08968;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Century Gothic', 'Segoe UI', sans-serif;
            background-color: var(--rosa-fondo);
            margin: 0;
            color: var(--cafe-texto);
        }

        /* BARRA DE NAVEGACIÓN */
        .navbar {
            background: var(--blanco);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* BANNER PRINCIPAL */
        .banner {
            width: 100%;
            height: 300px;
            background: linear-gradient(rgba(93, 64, 55, 0.4), rgba(93, 64, 55, 0.4)), 
                        url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=1487&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .banner h2 { font-size: 3rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        /* GRID DE PRODUCTOS */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--dorado);
            margin: 10px auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--blanco);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            text-align: center;
            border: 1px solid var(--rosa-fuerte);
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .price {
            color: var(--dorado);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: block;
        }

        .btn-add {
            background-color: var(--cafe-texto);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 0 0 15px 15px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-add:hover { background-color: var(--dorado); }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>Glow Studio</h1>
        <div class="nav-icons">
            <i class="fas fa-search" style="cursor: pointer;"></i>
            <i class="fas fa-shopping-bag" style="cursor: pointer;"></i>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <header class="banner">
        <h2>Nueva Colección</h2>
        <p>Resalta tu belleza natural</p>
    </header>

    <div class="container">
        <h2 class="section-title">Nuestros Productos</h2>
        
        <div class="products-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500" class="product-img">
                <div class="product-info">
                    <h3>Labial Matte "Rosé"</h3>
                    <span class="price">$350.00 MXN</span>
                </div>
                <button class="btn-add">Agregar al Carrito</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1522338221020-fa7c00446b1d?w=500" class="product-img">
                <div class="product-info">
                    <h3>Paleta de Sombras Earth</h3>
                    <span class="price">$850.00 MXN</span>
                </div>
                <button class="btn-add">Agregar al Carrito</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1596704017254-9b121068fb31?w=500" class="product-img">
                <div class="product-info">
                    <h3>Base de Maquillaje Fluida</h3>
                    <span class="price">$520.00 MXN</span>
                </div>
                <button class="btn-add">Agregar al Carrito</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1631214503951-375103322e4c?w=500" class="product-img">
                <div class="product-info">
                    <h3>Suero Revitalizante</h3>
                    <span class="price">$420.00 MXN</span>
                </div>
                <button class="btn-add">Agregar al Carrito</button>
            </div>
        </div>
    </div>

    <script>
        // Función para cerrar sesión (Registra Bitácora 3)
        async function cerrarSesion() {
            try {
                // Llamamos a la ruta del servidor para que guarde el log de CIERRE_SESION
                await fetch('/logout');
                // Redirigimos al index
                window.location.href = "/";
            } catch (err) {
                console.error("Error al cerrar sesión:", err);
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>
