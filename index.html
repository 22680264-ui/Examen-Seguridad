<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Login</title>
    <style>
        /* TU DISEÑO ORIGINAL COMPLETO */
        body { font-family: 'Century Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('fondologin.webp') center/cover; }
        .box { background: rgba(255, 255, 255, 0.75); padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; width: 340px; backdrop-filter: blur(10px); }
        h2 { color: #5d4037; text-transform: uppercase; letter-spacing: 2px; }
        input, select { display: block; width: 100%; margin: 15px 0; padding: 15px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #b08968; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #8d6e63; transform: scale(1.02); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 25px; width: 320px; text-align: center; position: relative; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Glow Studio</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">ENTRAR</button>
        </form>
        <button onclick="document.getElementById('m').style.display='flex'" style="background:#8d6e63; margin-top:10px;">Registrarte</button>
    </div>

    <div id="m" class="modal">
        <div class="modal-content">
            <h3>Crear Cuenta</h3>
            <form id="regForm">
                <input type="text" name="username" placeholder="Nuevo Usuario" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <select name="rol">
                    <option value="usuario">Cliente (Usuario)</option>
                    <option value="admin">Staff (Admin)</option>
                </select>
                <button type="submit" style="background:#5d4037">Registrar en BD</button>
            </form>
            <button onclick="document.getElementById('m').style.display='none'" style="background:none; color:red; border:none; margin-top:10px; cursor:pointer;">Cerrar</button>
        </div>
    </div>

    <script>
        // CONEXIÓN DE REGISTRO A MONGODB
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/registro', {
                method: 'POST',
                body: new URLSearchParams(new FormData(e.target))
            });
            if(res.ok) {
                alert("¡Usuario guardado en MongoDB Atlas!");
                location.reload();
            } else {
                alert("Error al registrar.");
            }
        };
    </script>
</body>
</html>
