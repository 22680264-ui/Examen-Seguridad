<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Login</title>
    <style>
        
        body { font-family: 'Century Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url("C:\Users\rebec\OneDrive\Escritorio\Examen Segueridad Web\fondologin.webp") center/cover; }
        .box { background: rgba(255, 255, 255, 0.75); padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; width: 340px; backdrop-filter: blur(10px); }
        h2 { color: #5d4037; text-transform: uppercase; letter-spacing: 2px; }
        input { display: block; width: 100%; margin: 15px 0; padding: 15px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #b08968; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        
      
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-contenido { background: white; padding: 30px; border-radius: 25px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .cerrar-modal { float: right; cursor: pointer; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Glow Studio</h2>
        <form id="loginForm">
            <input type="text" name="user" id="u" placeholder="Usuario" required>
            <input type="password" name="pass" id="p" placeholder="Contraseña" required>
            <button type="submit">ENTRAR</button>
        </form>
        <button id="btnRegistrarte" style="background: #8d6e63;">Registrarte</button>
    </div>

    <div id="modalRegistro" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrarModalBtn">&times;</span>
            <h3>Crear cuenta</h3>
            <form id="registerForm">
                <input type="text" name="user" placeholder="Nombre de usuario" required>
                <input type="password" name="pass" placeholder="Contraseña" required>
                <select name="rol" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 12px;">
                    <option value="usuario">Cliente (Usuario)</option>
                    <option value="admin">Staff (Admin)</option>
                </select>
                <button type="submit">Crear usuario</button>
            </form>
        </div>
    </div>

    <script>
        // Lógica para abrir/cerrar modal
        const modal = document.getElementById('modalRegistro');
        document.getElementById('btnRegistrarte').onclick = () => modal.style.display = 'flex';
        document.getElementById('cerrarModalBtn').onclick = () => modal.style.display = 'none';

        // --- ENVIAR LOGIN AL SERVIDOR ---
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));
            
            const response = await fetch('/login', {
                method: 'POST',
                body: formData
            });

            if (response.redirected) {
                // Si los datos son correctos, el servidor nos mandará a admin.html o user.html
                window.location.href = response.url;
            } else {
                alert("Usuario o contraseña incorrectos. Evento registrado en bitácora.");
            }
        };

        // --- ENVIAR REGISTRO AL SERVIDOR (MONGODB) ---
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));

            const response = await fetch('/registro', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert("Usuario creado en la nube. Ya puedes iniciar sesión.");
                modal.style.display = 'none';
            } else {
                alert("Error al registrar. Intenta con otro nombre.");
            }
        };
    </script>
</body>
</html>
