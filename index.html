<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glow Studio - Login</title>
    <style>
        body { 
            font-family: 'Century Gothic', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            /* La ruta debe ser simple para que Render la encuentre */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("fondologin.webp") center/cover; 
        }
        .box { background: rgba(255, 255, 255, 0.85); padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; width: 340px; backdrop-filter: blur(10px); }
        h2 { color: #5d4037; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        input, select { display: block; width: 100%; margin: 15px 0; padding: 15px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 15px; background: #b08968; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-contenido { background: white; padding: 30px; border-radius: 25px; width: 320px; text-align: center; position: relative; }
        .cerrar-modal { position: absolute; right: 20px; top: 10px; cursor: pointer; font-size: 28px; color: #aaa; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Glow Studio</h2>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">ENTRAR</button>
        </form>
        <button id="btnRegistrarte" style="background: #8d6e63;">Registrarte</button>
    </div>

    <div id="modalRegistro" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrarModalBtn">&times;</span>
            <h3>Crear cuenta</h3>
            <form id="registerForm">
                <input type="text" name="username" placeholder="Nombre de usuario" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <select name="rol">
                    <option value="usuario">Usuario</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit" style="background: #5d4037;">Crear usuario</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalRegistro');
        document.getElementById('btnRegistrarte').onclick = () => modal.style.display = 'flex';
        document.getElementById('cerrarModalBtn').onclick = () => modal.style.display = 'none';

        // Lógica de Login
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));
            
            const response = await fetch('/login', {
                method: 'POST',
                body: formData
            });

            if (response.redirected) {
                window.location.href = response.url;
            } else {
                alert("Error: Usuario o contraseña incorrectos. Evento registrado en bitácora.");
            }
        };

        // Lógica de Registro
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));

            const response = await fetch('/registro', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert("Usuario registrado. Ya puedes entrar.");
                modal.style.display = 'none';
            } else {
                alert("Error al registrar.");
            }
        };
    </script>
</body>
</html>
